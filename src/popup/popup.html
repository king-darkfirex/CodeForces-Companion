<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CF Companion — Phase 1 Debug</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 340px;
        padding: 12px;
        color: #1c1c1c;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .note {
        font-size: 11px;
        color: #888;
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 12px;
        margin-top: 8px;
        margin-bottom: 2px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 4px 6px;
        font-size: 13px;
      }
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 4px 6px;
        font-size: 13px;
        margin-top: 8px;
      }
      button {
        margin-top: 8px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .row {
        display: flex;
        gap: 6px;
      }
      .row input {
        flex: 1;
      }
      pre {
        background: #f5f5f5;
        padding: 8px;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 220px;
        overflow: auto;
      }
      .random-result {
        margin-top: 8px;
        font-size: 12px;
      }
      .random-result a {
        color: #1a73e8;
      }
    </style>
  </head>
  <body>
    <h1>CF Companion — Phase 1 Debug</h1>
    <p class="note">
      Temporary debug view for validating the data layer. The real dashboard/practice UI arrives in later phases.
    </p>

    <label for="handle">Codeforces handle</label>
    <input id="handle" type="text" placeholder="e.g. tourist" />
    <button id="sync">Sync</button>
    <button id="refresh">Force refresh</button>

    <div class="row">
      <div>
        <label for="minRating">Min rating</label>
        <input id="minRating" type="number" value="1200" />
      </div>
      <div>
        <label for="maxRating">Max rating</label>
        <input id="maxRating" type="number" value="1400" />
      </div>
    </div>
    <label for="status">Status</label>
    <select id="status">
      <option value="all">All</option>
      <option value="solved">Solved</option>
      <option value="attempted">Attempted</option>
      <option value="unattempted" selected>Unattempted</option>
    </select>
    <button id="query">Count problems in range</button>

    <button id="random">Random Problem</button>
    <div id="randomResult" class="random-result"></div>

    <pre id="output">Enter your Codeforces handle to start analyzing your solving history.</pre>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
